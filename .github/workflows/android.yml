name: Android 3D build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# A new run for the same branch immediately supersedes an older run.
# This cancels queued/pending/running executions before they waste CI time.
concurrency:
  group: aetheria-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older main runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for status in pending in_progress; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=${status}&per_page=100" |
              jq -r '.workflow_runs[] | select(.id != ($ENV.CURRENT_RUN|tonumber)) | .id' |
              sort -n -u |
              while read -r run_id; do
                [ -z "$run_id" ] && continue
                echo "Cancelling superseded run $run_id"
                curl --fail --silent --show-error -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" >/dev/null
              done
          done

  cleanup-retired-sources:
    needs: cancel-superseded
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove retired generated sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/sourcebank generated_catalog offline/catalog
          find . -type d -name .gradle -prune -exec rm -rf {} +
          while IFS= read -r file; do
            git rm --cached --ignore-unmatch -- "$file" || true
          done < <(git ls-files | grep -E '(^|/)(tools/sourcebank/|generated_catalog/|offline/catalog/|\.gradle/)' || true)

      - name: Verify app/src has no retired-source references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'tools/sourcebank|generated_catalog|offline/catalog' app/src; then
            echo "Forbidden retired-source reference found under app/src."
            exit 1
          fi
          echo "No retired-source references found under app/src."

      - name: Commit cleanup when needed
        shell: bash
        run: |
          set -euo pipefail
          git add -A .gitignore
          if git diff --cached --quiet; then
            echo "Repository already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove retired generated source catalogs [skip ci]"
          git push origin HEAD:main

  build:
    needs: cleanup-retired-sources
    concurrency:
      group: aetheria-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/export_templates.tpz" "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2"
          rm -rf "$RUNNER_TEMP/godot/templates"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/export_templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          debug_template=$(find "$RUNNER_TEMP/godot/templates" -type f -name 'android_debug.apk' -print -quit)
          release_template=$(find "$RUNNER_TEMP/godot/templates" -type f -name 'android_release.apk' -print -quit)
          test -n "$debug_template"
          test -n "$release_template"
          cp "$debug_template" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          cp "$release_template" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Validate no retired source references
        run: |
          set -e
          ! grep -RInE 'tools/sourcebank|generated_catalog|offline/catalog' app/src

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --quit --path godot
          test -f godot/project.godot
          test -f godot/export_presets.cfg
          test -f godot/scenes/Main.tscn
          test -f godot/scripts/game_root.gd
          test -f godot/scripts/core/content_database.gd
          test -f godot/scripts/gameplay/combat_service.gd
          test -f godot/scripts/tests/../core/game_state.gd || true
          "$GODOT_BIN" --headless --path godot --script tests/test_runner.gd
          "$GODOT_BIN" --headless --path godot --export-debug "Android" "$RUNNER_TEMP/aetheria-echoes-godot-debug.apk"

      - name: Count meaningful source
        shell: bash
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            total=$((total + lines))
          done < <(find app/src godot -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.java' -o -name '*.gd' \) -print0)
          echo "MEANINGFUL_SOURCE_LINES=$total" >> "$GITHUB_STEP_SUMMARY"
          echo "Meaningful source lines: $total"

      - name: Publish Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-echoes-godot-debug-apk
          path: ${{ runner.temp }}/aetheria-echoes-godot-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Android host with Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Publish Android host APK
        uses: actions/upload-artifact@v4
        with:
          name: teste-jue-host-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
