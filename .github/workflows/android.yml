name: Android 3D build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Keep CI serialized: a newer run supersedes any older pending/running run.
concurrency:
  group: android-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-older-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older queued or running workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow "$WORKFLOW_NAME" \
            --branch "$BRANCH_NAME" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] |
              select(.databaseId < ($ENV.CURRENT_RUN | tonumber)) |
              select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") |
              .databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh run cancel "$run_id" || true
          done

  build:
    needs: cancel-older-runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Count source lines
        shell: bash
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            total=$((total + lines))
          done < <(find . -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.java' -o -name '*.gradle' -o -name '*.py' \) -not -path './.git/*' -print0)
          echo "TOTAL_SOURCE_LINES=$total"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: teste-jue-3d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
